name: Build Android APK

on:
  push:
    paths-ignore:
      - '**.txt'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare the web files
        run: python android-app/make_android.py

      - name: Install Capacitor
        working-directory: android-app
        run: npm install

      - name: Create the Android project
        working-directory: android-app
        run: npx cap add android

      - name: Landscape screen (the panel is wide)
        working-directory: android-app
        run: sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Copy the web files into the app
        working-directory: android-app
        run: npx cap sync android

      - name: Build the APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk DX-Arranger.apk

      - name: Keep the APK as a download on the run page
        uses: actions/upload-artifact@v4
        with:
          name: DX-Arranger-Android
          path: DX-Arranger.apk

      - name: Also publish it under Releases (direct download on a phone)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest DX-Arranger.apk --target "${{ github.sha }}" --title "DX Arranger for Android (latest)" --notes "Download DX-Arranger.apk, open it on your phone and install. Allow 'install unknown apps' for your browser or Files app if asked."

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Control Panel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap">
<style>
  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    height: 100vh;
    width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a1e;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }

  body.welcome-active .bulb {
    background: #3a3a40 !important;
    box-shadow: none !important;
    animation: none !important;
  }

  body.welcome-active .btn {
    opacity: 0.42;
    filter: grayscale(1);
  }

  .dx-welcome {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ok);
    font-family: 'JetBrains Mono','Fira Code','SF Mono',Consolas,Menlo,'Courier New',monospace;
    transition: opacity 0.45s ease;
  }

  .dx-welcome.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .dx-logo {
    position: relative;
    color: var(--sel-fg);
    font-size: clamp(72px, 16vw, 150px);
    font-weight: 800;
    letter-spacing: 6px;
    line-height: 1;
    text-shadow: 0 0 14px var(--glow);
  }

  .dx-logo::before {
    content: '_';
    position: absolute;
    left: 100%;
    bottom: 0;
    color: var(--ok);
    animation: dx-blink 1s steps(1) infinite;
  }

  .dx-logo::after {
    content: var(--boot);
    position: absolute;
    left: 50%;
    bottom: -30px;
    transform: translateX(-50%);
    width: max-content;
    color: var(--ok);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 1px;
    text-shadow: none;
  }

  @keyframes dx-blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .device {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    position: relative;
  }

  .tempo-guide {
    position: absolute;
    z-index: 0;
    pointer-events: none;
    background: transparent;
    box-shadow: none;
  }

  .tempo-guide-horizontal {
    height: 0;
    border-top: 1px dotted rgba(255,255,255,0.9);
  }

  .tempo-guide-vertical {
    width: 0;
    border-left: 1px dotted rgba(255,255,255,0.9);
  }

  .screen-row,
  .grid-row-wrapper,
  .device > .panel {
    position: relative;
    z-index: 1;
  }

  .page-bounds {
    position: absolute;
    border: 1px dashed #ffffff;
    pointer-events: none;
    z-index: 999;
    box-sizing: border-box;
  }

  .page-master-btn {
    position: fixed !important;
    top: 16px !important;
    left: 84px !important;
    width: 140px !important;
    height: 60px !important;
    z-index: 1000;
    font-size: 12px;
    letter-spacing: 1px;
    padding-bottom: 0;
    align-items: center;
    justify-content: center;
  }

  .page-efx-btn {
    position: fixed !important;
    top: 16px !important;
    right: 56px !important;
    width: 140px !important;
    height: 60px !important;
    z-index: 1000;
    font-size: 12px;
    letter-spacing: 1px;
    padding-bottom: 0;
    align-items: center;
    justify-content: center;
  }

  .screen-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 18px;
  }

  .side-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .btn.small {
    width: 44px;
    height: 25px;
    font-size: 12px;
    padding-bottom: 0;
    align-items: center;
    justify-content: center;
  }

  .btn.small .bulb {
    top: 0px;
    width: 15px;
    height: 3px;
  }

  .screen-frame {
    background: linear-gradient(#2a2a2e, #141416);
    border: 1px solid #000;
    border-radius: 0px;
    padding: 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 4px 10px rgba(0,0,0,0.5);
    width: 720px;
    aspect-ratio: 16 / 9;
    box-sizing: border-box;
    display: flex;
  }

  .screen {
    background: #050507;
    border-radius: 4px;
    padding: 10px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    width: 100%;
  }

  .screen-main {
    /* LCD theme variables (Dev Dark defaults; themes override these from JS) */
    --bg: #0d1117; --bg2: #161b22; --line: #30363d; --ln: #484f58;
    --fg: #c9d1d9; --dim: #6e7681; --opt: #a5d6ff;
    --sel-fg: #e6edf3; --sel-bg: rgba(56,139,253,0.16); --sel-bar: #58a6ff;
    --kw: #ff7b72; --fn: #d2a8ff; --pn: #8b949e; --ok: #3fb950;
    --mode-bg: #238636; --mode-fg: #ffffff; --end-bg: #1f6feb; --end-fg: #ffffff;
    --val: #79c0ff; --scan: rgba(255,255,255,0.035); --glow: rgba(63,185,80,0.55);
    --cursor: #58a6ff; --d1: #ff5f56; --d2: #ffbd2e; --d3: #27c93f;
    --title: 'dx-arranger — zsh — 80x24';
    --boot: '$ boot --mode "DIGITAL EXPERIENCE"';
    --ps: '~/dx-arranger $';

    background: var(--bg);
    border-radius: 3px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 0 1px var(--line), inset 0 0 40px rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg);
    font-family: 'JetBrains Mono','Fira Code','SF Mono',Consolas,Menlo,'Courier New',monospace;
    font-size: 12px;
    letter-spacing: 0;
    text-align: start;
  }

  /* faint CRT scanlines over the whole display */
  .screen-main::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom, var(--scan) 0, var(--scan) 1px, transparent 1px, transparent 3px);
  }

  .lcd-menu {
    display: none;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    color: var(--fg);
    font-size: 13px;
    letter-spacing: 0;
    text-align: start;
  }

  .lcd-menu.visible {
    display: flex;
  }

  /* ---------- root menu: IDE window ---------- */
  .lcd-menu.windows-desktop {
    position: absolute;
    inset: 0;
    justify-content: space-between;
    background: var(--bg);
  }

  .lcd-menu.windows-desktop::before {
    content: var(--title);
    display: block;
    padding: 6px 12px 6px 62px;
    background:
      radial-gradient(circle at 16px 50%, var(--d1) 0 5px, transparent 5.5px),
      radial-gradient(circle at 34px 50%, var(--d2) 0 5px, transparent 5.5px),
      radial-gradient(circle at 52px 50%, var(--d3) 0 5px, transparent 5.5px),
      var(--bg2);
    border-bottom: 1px solid var(--line);
    color: var(--dim);
    font-size: 10px;
  }

  .lcd-desktop-icons {
    display: flex;
    flex: 1;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    gap: 0;
    width: 100%;
    padding: 14px 0 0;
  }

  .lcd-desktop-icons::before {
    content: '// select a module, use the arrows to navigate, ENTER to run';
    padding: 0 12px 10px 52px;
    color: var(--dim);
    font-size: 11px;
    font-style: italic;
  }

  .lcd-desktop-icon {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
    width: 100%;
    min-height: 28px;
    padding: 0 12px;
    border: 0;
    border-left: 2px solid transparent;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 13px;
    text-align: start;
    cursor: pointer;
  }

  .lcd-desktop-icon::before {
    display: none;
  }

  .lcd-desktop-icon .ln {
    width: 26px;
    color: var(--ln);
    text-align: right;
  }

  .lcd-desktop-icon .fn { text-transform: lowercase; }
  .lcd-desktop-icon .kw { color: var(--kw); }
  .lcd-desktop-icon .fn { color: var(--fn); }
  .lcd-desktop-icon .pn { color: var(--pn); }

  .lcd-desktop-icon.selected,
  .lcd-desktop-icon:focus-visible {
    border-left-color: var(--sel-bar);
    background: var(--sel-bg);
    outline: none;
  }

  .lcd-desktop-icon.selected .ln {
    color: var(--sel-fg);
  }

  .lcd-desktop-icon.selected::after {
    content: '';
    width: 8px;
    height: 15px;
    background: var(--cursor);
    animation: dx-blink 1s steps(1) infinite;
  }

  /* ---------- status bar ---------- */
  .lcd-desktop-taskbar {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 0;
    background: var(--bg2);
    border-top: 1px solid var(--line);
    font-size: 10px;
    color: var(--dim);
  }

  .lcd-start-button {
    border: 0;
    background: var(--mode-bg);
    color: var(--mode-fg);
    padding: 4px 10px;
    font: inherit;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .lcd-taskbar-window {
    padding: 4px 10px;
    color: var(--dim);
  }

  .lcd-taskbar-window + span {
    margin-left: auto;
    padding: 4px 10px;
    background: var(--end-bg);
    color: var(--end-fg);
  }

  /* ---------- sub menus: terminal listing ---------- */
  .lcd-option {
    padding: 3px 8px;
    flex-shrink: 0;
  }

  .lcd-menu.windows-desktop .lcd-option {
    display: none;
  }

  .lcd-menu:not(.windows-desktop) {
    position: absolute;
    inset: 0;
    padding: 14px 18px;
    background: var(--bg);
    border: 1px solid var(--line);
    counter-reset: ln;
    overflow-y: auto;
    scrollbar-width: none;
  }

  .lcd-menu:not(.windows-desktop)::-webkit-scrollbar {
    display: none;
  }

  .lcd-menu:not(.windows-desktop)::before {
    content: var(--ps) ' ls ' attr(data-page) '/';
    align-self: stretch;
    flex-shrink: 0;
    color: var(--ok);
    font-size: 11px;
    padding-bottom: 8px;
    margin-bottom: 6px;
    border-bottom: 1px dashed var(--line);
  }

  .lcd-menu:not(.windows-desktop) .lcd-option {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    box-sizing: border-box;
    padding: 5px 10px 5px 8px;
    border-left: 2px solid transparent;
    color: var(--opt);
    font-size: 13px;
    text-transform: lowercase;
    cursor: pointer;
  }

  .lcd-menu:not(.windows-desktop) .lcd-option::before {
    counter-increment: ln;
    content: counter(ln);
    min-width: 24px;
    color: var(--ln);
    text-align: right;
  }

  .lcd-menu:not(.windows-desktop) .lcd-option::after {
    content: '/';
    margin-left: -12px;
    color: var(--dim);
  }

  .lcd-menu[data-page="themes"] .lcd-option::after,
  .lcd-menu[data-page="languages"] .lcd-option::after {
    display: none;
  }

  .lcd-menu[data-page="languages"] .lcd-option {
    text-transform: none;
  }

  .lcd-menu:not(.windows-desktop) .lcd-option.selected {
    color: var(--sel-fg);
    background: var(--sel-bg);
    border-left-color: var(--sel-bar);
  }

  .lcd-option .act {
    color: var(--ok);
  }

  .lcd-option .sw {
    display: flex;
    gap: 3px;
    margin-left: auto;
  }

  .lcd-option .sw i {
    display: block;
    width: 10px;
    height: 10px;
    border: 1px solid rgba(128,128,128,0.55);
  }

  /* ---------- file browser: file tree ---------- */
  .lcd-files {
    display: none;
    flex-direction: column;
    gap: 8px;
    width: 94%;
    color: var(--fg);
    letter-spacing: 0;
  }

  .lcd-files.visible {
    display: flex;
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    padding: 10px 14px;
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
  }

  .lcd-files-status {
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 0;
    text-align: start;
    font-style: italic;
  }

  .lcd-files-status::before {
    content: '// ';
  }

  .lcd-file-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(7, 32px);
    grid-auto-flow: row;
    gap: 0;
  }

  .lcd-file {
    position: relative;
    min-width: 0;
    padding: 5px 7px 5px 9px;
    border: 0;
    border-left: 2px solid transparent;
    border-radius: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 12px;
    color: var(--opt);
    text-transform: lowercase;
  }

  .lcd-file::before {
    content: '\25b8  ';
    color: var(--ln);
  }

  .lcd-file.selected {
    color: var(--sel-fg);
    border-left-color: var(--sel-bar);
    background: var(--sel-bg);
  }

  .lcd-file.selected::before {
    color: var(--sel-bar);
  }

  .lcd-page-list {
    display: grid;
    grid-template-columns: repeat(8, minmax(24px, 1fr));
    gap: 2px;
    padding-right: 2px;
  }

  .lcd-page {
    padding: 3px 0;
    border: 0;
    border-top: 2px solid transparent;
    background: var(--bg2);
    color: var(--dim);
    font-size: 10px;
    text-align: center;
  }

  .lcd-page.selected {
    border-top-color: var(--sel-bar);
    background: var(--bg);
    color: var(--sel-fg);
  }

  /* ---------- tempo / volume popup: terminal dialog ---------- */
  .lcd-tempo {
    display: none;
    position: absolute;
    z-index: 2;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    min-width: 260px;
    padding: 14px 22px;
    background: var(--bg2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--ok);
    box-shadow: 0 8px 24px rgba(0,0,0,0.55);
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 1px;
  }

  .lcd-tempo.visible {
    display: flex;
  }

  .lcd-tempo > span:first-child::before {
    content: '$ set ';
    color: var(--ok);
  }

  .lcd-tempo-value {
    color: var(--val);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0;
  }

  .lcd-tempo-hint {
    color: var(--dim);
    font-size: 10px;
    font-style: italic;
    letter-spacing: 0;
    text-transform: lowercase;
  }

  .lcd-tempo-hint::before {
    content: '// ';
  }

  .lcd-file { cursor: pointer; }
  .lcd-file.empty:not(.selected) { opacity: 0.55; }
  .lcd-file.loaded::before { content: '\25cf  '; color: var(--ok); }

  .lcd-import {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 5;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.5);
  }

  .lcd-import.visible { display: flex; }

  .lcd-import-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 280px;
    padding: 14px 22px;
    background: var(--bg2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--ok);
    box-shadow: 0 8px 24px rgba(0,0,0,0.55);
    color: var(--fg);
    font-size: 12px;
  }

  .lcd-import-title { color: var(--val); font-size: 15px; font-weight: 600; }
  .lcd-import-title::before { content: '$ import '; color: var(--ok); font-weight: 400; }
  .lcd-import-text { color: var(--fg); }
  .lcd-import-keys { color: var(--dim); font-size: 10px; font-style: italic; }
  .lcd-import-keys b { color: var(--sel-fg); font-style: normal; }

  /* =====================================================
     THEME: CLASSIC BLUE  (the original LCD look)
     ===================================================== */
  .screen-main[data-mode="classic"] {
    font-family: 'Segoe UI', Arial, sans-serif;
    letter-spacing: 2px;
    text-align: center;
    color: rgba(255,255,255,0.35);
    background: #000;
  }

  .screen-main[data-mode="classic"] .dx-welcome {
    background: radial-gradient(circle at center, #173d63 0, #081522 48%, #020508 100%);
    color: #dff1ff;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  .screen-main[data-mode="classic"] .dx-logo {
    color: #fff;
    font-size: clamp(72px, 16vw, 180px);
    font-weight: 900;
    letter-spacing: 10px;
    text-shadow: 0 0 8px #6fc3ff, 0 0 26px rgba(74,163,255,0.9);
  }

  .screen-main[data-mode="classic"] .dx-logo::before {
    display: none;
  }

  .screen-main[data-mode="classic"] .dx-logo::after {
    content: 'DIGITAL EXPERIENCE';
    bottom: -24px;
    color: #8dcfff;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 4px;
  }

  .screen-main[data-mode="classic"] .lcd-menu {
    color: #d8dade;
    font-size: 18px;
    letter-spacing: 2px;
  }

  .screen-main[data-mode="classic"] .lcd-menu.windows-desktop {
    padding: 12px;
    background: linear-gradient(145deg, #12395f, #071728 72%);
    color: #e8f2ff;
    letter-spacing: 0;
  }

  .screen-main[data-mode="classic"] .lcd-menu.windows-desktop::before,
  .screen-main[data-mode="classic"] .lcd-desktop-icons::before,
  .screen-main[data-mode="classic"] .lcd-desktop-icon .ln,
  .screen-main[data-mode="classic"] .lcd-desktop-icon .kw,
  .screen-main[data-mode="classic"] .lcd-desktop-icon .pn,
  .screen-main[data-mode="classic"] .lcd-desktop-icon.selected::after {
    display: none;
  }

  .screen-main[data-mode="classic"] .lcd-desktop-icons {
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 0;
  }

  .screen-main[data-mode="classic"] .lcd-desktop-icon {
    justify-content: center;
    width: min(260px, 88%);
    min-height: 28px;
    padding: 4px 10px;
    border: 1px solid #74b9ed;
    background: rgba(7, 23, 40, 0.82);
    color: #e8f2ff;
    font-size: 9px;
    text-align: center;
  }

  .screen-main[data-mode="classic"] .lcd-desktop-icon .fn {
    color: inherit;
    text-transform: uppercase;
  }

  .screen-main[data-mode="classic"] .lcd-desktop-icon.selected,
  .screen-main[data-mode="classic"] .lcd-desktop-icon:focus-visible {
    border-color: #dff1ff;
    background: rgba(91, 168, 237, 0.45);
  }

  .screen-main[data-mode="classic"] .lcd-desktop-taskbar {
    gap: 8px;
    margin: auto -12px -12px;
    padding: 5px 8px;
    background: rgba(7, 19, 33, 0.9);
    border-top: 1px solid rgba(169, 213, 255, 0.4);
    font-size: 9px;
    color: #e8f2ff;
  }

  .screen-main[data-mode="classic"] .lcd-start-button {
    border: 1px solid #5aa9ec;
    background: #1c5d91;
    color: #fff;
    padding: 4px 8px;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0;
  }

  .screen-main[data-mode="classic"] .lcd-taskbar-window {
    padding: 4px 8px;
    color: #b9dcfa;
  }

  .screen-main[data-mode="classic"] .lcd-taskbar-window + span {
    margin-left: 0;
    padding: 0;
    background: none;
    color: inherit;
  }

  .screen-main[data-mode="classic"] .lcd-menu:not(.windows-desktop) {
    padding: 16px 24px;
    background:
      linear-gradient(rgba(25, 70, 108, 0.22) 1px, transparent 1px),
      linear-gradient(90deg, rgba(25, 70, 108, 0.22) 1px, transparent 1px),
      linear-gradient(145deg, #0d263f, #070b12 78%);
    background-size: 18px 18px, 18px 18px, auto;
    border: 1px solid #28557c;
    box-shadow: inset 0 0 24px rgba(24, 109, 176, 0.18);
  }

  .screen-main[data-mode="classic"] .lcd-menu:not(.windows-desktop)::before {
    content: 'CONTROL PANEL / LCD OS';
    color: #6aa7d8;
    font-size: 9px;
    letter-spacing: 2px;
    padding-bottom: 8px;
    margin-bottom: 0;
    border-bottom: 1px solid #28557c;
  }

  .screen-main[data-mode="classic"] .lcd-menu:not(.windows-desktop) .lcd-option {
    justify-content: space-between;
    gap: 0;
    padding: 3px 8px;
    border: 1px solid #28557c;
    background: rgba(7, 23, 40, 0.82);
    color: #d8dade;
    font-size: 18px;
    text-transform: none;
  }

  .screen-main[data-mode="classic"] .lcd-menu[data-page="themes"] .lcd-option {
    font-size: 13px;
  }

  .screen-main[data-mode="classic"] .lcd-menu:not(.windows-desktop) .lcd-option::before,
  .screen-main[data-mode="classic"] .lcd-menu:not(.windows-desktop) .lcd-option::after {
    display: none;
  }

  .screen-main[data-mode="classic"] .lcd-menu:not(.windows-desktop) .lcd-option.selected {
    color: #ffa84a;
    background: rgba(255, 168, 74, 0.12);
    border-color: #28557c;
  }

  .screen-main[data-mode="classic"] .lcd-option .act {

    'zh-CN': '风格|设置|效果|主题|语言|内置|用户扩展',
    'zh-TW': '風格|設定|效果|主題|語言|內建|使用者擴充',
    ja: 'スタイル|設定|エフェクト|テーマ|言語|内蔵|ユーザー拡張',

  };
  let lcdLangCode = 'en';
  try {
    const storedLang = localStorage.getItem(lcdLangStorageKey);
    if (storedLang && lcdLanguages.some(language => language.code === storedLang)) lcdLangCode = storedLang;

    applyLcdLanguage(code);

      localStorage.setItem(lcdLangStorageKey, code);

    }
  }

  applyLcdLanguage(lcdLangCode);

  const menuPages = {
    get root() { return getLcdWords().slice(0, 5); },

  let menuPage = 'root';

  function renderLcdMenu() {
    lcdMenu.dataset.page = menuPage;

      }

    const selectedOption = lcdMenu.querySelector('.lcd-option.selected');

  document.addEventListener('click', event => {

  // --- Inbuilt style slots: empty until a style file is imported ---

  const lcdImportBox = document.getElementById('lcdImportBox');
  const styleImportInput = document.getElementById('styleImportInput');
  let importSlot = null;
  let fileStatusMessage = '';

  const slotLabel = slot => 'FILE ' + String(slot).padStart(3, '0');
  const selectedSlot = () => filePage * filesPerPage + fileRow * 2 + fileColumn + 1;

  function openImportPrompt(slot) {

      '<div class="lcd-import-text">NOT LOADED. IMPORT STYLE FROM FILES?</div>' +

  function closeImportPrompt() {
    importSlot = null;
    lcdImport.classList.remove('visible');
  }

  function promptImportIfEmpty() {
    if (fileType !== 'inbuilt') return;
    const slot = selectedSlot();

  }

  styleImportInput.addEventListener('change', () => {

        fileStatusMessage = '';

  document.addEventListener('click', event => {

  });

  function openFileBrowser(type, page = 0) {
    fileType = type;
    const pageCount = type === 'user' ? Math.max(1, Math.ceil(userFiles.length / filesPerPage)) : 16;
    filePage = Math.max(0, Math.min(pageCount - 1, page));

  }

  let filePressTimer = null;
  let fileRepeatTimer = null;
  let suppressFileClick = false;

  function stopFileButtonRepeat() {

    clearInterval(fileRepeatTimer);

    fileRepeatTimer = null;
  }

  document.addEventListener('pointerdown', event => {
    const navigationButton = event.target.closest('[data-id="NAV-UP"], [data-id="NAV-DOWN"]');
    if (!navigationButton || !lcdFiles.classList.contains('visible') || importSlot !== null) return;

    const direction = navigationButton.dataset.id === 'NAV-UP' ? 'up' : 'down';
    suppressFileClick = false;

      suppressFileClick = true;
      moveFileSelection(direction);
      fileRepeatTimer = setInterval(() => moveFileSelection(direction), 90);

  });

  ['pointerup', 'pointercancel', 'pointerleave'].forEach(eventName => {
    document.addEventListener(eventName, event => {
      // touch: the "pointer left" event targets the page itself (no .closest): stop the repeat then too
      const navigationButton = event.target.closest ? event.target.closest('[data-id="NAV-UP"], [data-id="NAV-DOWN"]') : document;
      if (!navigationButton) return;
      stopFileButtonRepeat();

  });

  document.addEventListener('click', event => {
    const quickAccessButton = event.target.closest('[data-id^="G-"]');

  function renderFileBrowser() {
    if (fileType === 'user' && userFiles.length === 0) {
      lcdFiles.innerHTML = '<div class="lcd-files-status">SELECT A FOLDER TO VIEW FILES</div>';
      return;
    }

    const filePrefix = fileType === 'user' ? 'MY FILE ' : 'FILE ';
    const files = fileType === 'user'
      ? userFiles.slice(filePage * filesPerPage, filePage * filesPerPage + filesPerPage)
      : Array.from({ length: filesPerPage }, (_, index) => {
          const slot = filePage * filesPerPage + index + 1;
          return loadedStyles[slot] ? loadedStyles[slot].name : filePrefix + String(slot).padStart(3, '0');
        });
    const fileMarkup = files.map((file, index) => {
      const selected = index === fileRow * 2 + fileColumn ? ' selected' : '';
      const slot = filePage * filesPerPage + index + 1;
      const state = fileType === 'inbuilt' ? (loadedStyles[slot] ? ' loaded' : ' empty') : '';
      return '<span class="lcd-file' + selected + state + '" data-index="' + index + '">' + file + '</span>';
    }).join('');
    const pageCount = fileType === 'user' ? Math.max(1, Math.ceil(userFiles.length / filesPerPage)) : 16;
    if (filePage >= pageCount) filePage = pageCount - 1;
    const pageMarkup = Array.from({ length: pageCount }, (_, index) =>
      '<span class="lcd-page' + (index === filePage ? ' selected' : '') + '">' + (index + 1) + '</span>'
    ).join('');

    lcdFiles.innerHTML =
      '<div class="lcd-files-status">' + (fileStatusMessage || (fileType === 'user' ? 'USER FILES' : 'INBUILT FILES')) + '</div>' +
      '<div class="lcd-file-grid">' + fileMarkup + '</div>' +

  userFolderInput.addEventListener('change', () => {

    userFiles.sort((firstFile, secondFile) => firstFile.localeCompare(secondFile));
    filePage = 0;
    fileRow = 0;
    fileColumn = 0;
    renderFileBrowser();
  });

  function moveFileSelection(direction) {
    const pageCount = fileType === 'user' ? Math.max(1, Math.ceil(userFiles.length / filesPerPage)) : 16;
    if (direction === 'up') fileRow = Math.max(0, fileRow - 1);
    if (direction === 'down') {
      if (fileRow < 6) {
        fileRow += 1;
      } else if (fileColumn === 0) {
        fileColumn = 1;
        fileRow = 0;
      } else if (filePage < pageCount - 1) {
        filePage += 1;
        fileColumn = 0;
        fileRow = 0;
      }
    }
    if (direction === 'left') {
      if (fileColumn === 1) fileColumn = 0;
      else if (filePage > 0) {
        filePage -= 1;
        fileColumn = 1;
      }
    }
    if (direction === 'right') {
      if (fileColumn === 0) fileColumn = 1;
      else if (filePage < pageCount - 1) {
        filePage += 1;
        fileColumn = 0;
      }
    }
    renderFileBrowser();
  }

  document.addEventListener('click', event => {
    const navigationButton = event.target.closest('[data-id^="NAV-"]');
    if (!navigationButton) return;

    const navigationId = navigationButton.dataset.id;
    if (importSlot !== null) {
      if (navigationId === 'NAV-ENTER') confirmImport();
      else if (navigationId === 'NAV-LEFT') closeImportPrompt();
      return;
    }
    if (lcdFiles.classList.contains('visible')) {
      if ((navigationId === 'NAV-UP' || navigationId === 'NAV-DOWN') && suppressFileClick) {
        suppressFileClick = false;
        return;
      }
      if (navigationId === 'NAV-UP') moveFileSelection('up');
      if (navigationId === 'NAV-DOWN') moveFileSelection('down');
      if (navigationId === 'NAV-LEFT') moveFileSelection('left');
      if (navigationId === 'NAV-RIGHT') moveFileSelection('right');
      if (navigationId === 'NAV-ENTER') promptImportIfEmpty();
      if (navigationId === 'NAV-LEFT' && filePage === 0 && fileColumn === 0 && fileRow === 0) {
        lcdFiles.classList.remove('visible');
        lcdMenu.classList.add('visible');
        menuPage = 'styles';
        menuIndex = 0;
        renderLcdMenu();
      }
      return;
    }
    if (!lcdMenu.classList.contains('visible')) return;

    if (navigationId === 'NAV-UP') moveMenuSelection(-1);
    if (navigationId === 'NAV-DOWN') moveMenuSelection(1);
    if (navigationId === 'NAV-ENTER' || navigationId === 'NAV-RIGHT') openSelectedMenu();
    if (navigationId === 'NAV-LEFT' && menuPage !== 'root') {
      if (menuPage === 'themes') revertLcdTheme();
      menuIndex = menuPage === 'themes' ? 3 : (menuPage === 'languages' ? 4 : 0);
      menuPage = 'root';
      renderLcdMenu();
    }
  });

  const bpmInput = document.getElementById('bpm');
  let activeComponent = null;
  let masterVolume = 100;
  const componentVolumes = {
    'VOL-1': 100,
    'VOL-2': 100,
    'VOL-3': 100,
    'VOL-4': 100,
    'VOL-5': 100,
    'VOL-6': 100
  };

  function showRootMenu() {
    closeImportPrompt();
    revertLcdTheme();
    activeComponent = null;
    lcdFiles.classList.remove('visible');
    lcdTempo.classList.remove('visible');
    lcdMenu.classList.add('visible');

    menuIndex = 0;
    renderLcdMenu();
  }

  function showTempoStatus() {
    activeComponent = 'TEMPO';
    lcdTempo.classList.add('visible');
    lcdTempo.innerHTML =
      '<span>TEMPO</span>' +
      '<span class="lcd-tempo-value" id="lcdTempoValue">' + bpmInput.value + ' BPM</span>' +
      '<span class="lcd-tempo-hint">- / + TO CHANGE, ENTER TO CONFIRM</span>';
  }

  function showComponentStatus(component) {
    activeComponent = component;
    lcdTempo.classList.add('visible');
    const value = component === 'MASTER' ? masterVolume : componentVolumes[component];
    lcdTempo.innerHTML =
      '<span>' + (component === 'MASTER' ? 'MASTER VOLUME' : 'VOLUME ' + component.slice(4)) + '</span>' +
      '<span class="lcd-tempo-value" id="lcdTempoValue">' + value + '%</span>' +
      '<span class="lcd-tempo-hint">- / + TO CHANGE, ENTER TO CONFIRM</span>';
  }

  function changeTempo(amount) {
    const nextBpm = Math.max(20, Math.min(300, (Number(bpmInput.value) || 120) + amount));
    bpmInput.value = nextBpm;
    bpmInput.dispatchEvent(new Event('input', { bubbles: true }));
    lcdTempo.querySelector('.lcd-tempo-value').textContent = nextBpm + ' BPM';
  }

  document.querySelector('.tempo-col').addEventListener('click', showTempoStatus);

  document.addEventListener('click', event => {
    const masterButton = event.target.closest('[data-id="MASTER"]');

  document.addEventListener('click', event => {
    const componentButton = event.target.closest('[data-id="NAV2-LEFT"], [data-id="NAV2-ENTER"], [data-id="NAV2-RIGHT"]');
    if (!componentButton || !activeComponent) return;

    if (componentButton.dataset.id === 'NAV2-ENTER') {
      lcdTempo.classList.add('visible');
      return;
    }

    const amount = componentButton.dataset.id === 'NAV2-RIGHT' ? 1 : -1;
    if (activeComponent === 'TEMPO') {
      changeTempo(amount);
    } else if (activeComponent === 'MASTER') {
      masterVolume = Math.max(0, Math.min(100, masterVolume + amount));
      showComponentStatus('MASTER');
    } else {
      componentVolumes[activeComponent] = Math.max(0, Math.min(100, componentVolumes[activeComponent] + amount));
      showComponentStatus(activeComponent);
    }
  });

  const toggleGroupIds = [
    'cmRow', 'introRow', 'variationRow', 'breakRow', 'endingRow',
    'syncroRow', 'regRow', 'padRow', 'stopRow', 'percussionRow', 'percussionRow2', 'volumeKnobs',
    'gridRow1', 'gridRow2'
  ];
  const groups = toggleGroupIds.map(id => document.getElementById(id));

  function setBeatDuration() {
    const bpm = Math.max(20, Math.min(300, Number(bpmInput.value) || 120));
    const seconds = 60 / bpm;
    document.documentElement.style.setProperty('--beat-duration', seconds + 's');

  function restartBulbAnimations() {
    document.querySelectorAll('.btn.active .bulb').forEach(bulb => {

      bulb.style.animation = '';
    });
  }

  // INTRO, MAIN VARIATION and ENDING share one group: only one bulb lights across all three.
  const linkedRowIds = ['introRow', 'variationRow', 'endingRow'];
  const groupSets = toggleGroupIds.filter(id => !linkedRowIds.includes(id)).map(id => [id]);
  groupSets.push(linkedRowIds);
  groupSets.forEach(ids => {
    const groupButtons = ids.flatMap(id => Array.from(document.getElementById(id).querySelectorAll('.btn')));
    groupButtons.forEach(btn => {

        restartBulbAnimations();

  setBeatDuration();

  // --- Page bounds marker: 2px above LCD, 2px left of TEMPO, 2px right of MUTE, 2px below bottom panel ---
  const deviceEl2 = document.querySelector('.device');
  const pageBoundsEl = document.getElementById('pageBounds');

  function drawPageBounds() {
    const screenFrame = document.querySelector('.screen-frame');
    const tempoPanel = document.querySelector('.left-side-panels .panel-box:first-child');
    const mutePanel = document.querySelectorAll('.right-side-panels > .panel-box')[0];
    const bottomPanel = document.querySelector('.device > .panel');

    if (!screenFrame || !tempoPanel || !mutePanel || !bottomPanel) return;

    const dr = deviceEl2.getBoundingClientRect();
    const scale = dr.width / deviceEl2.offsetWidth || 1;

    const sfRect = screenFrame.getBoundingClientRect();
    const tpRect = tempoPanel.getBoundingClientRect();
    const mpRect = mutePanel.getBoundingClientRect();
    const bpRect = bottomPanel.getBoundingClientRect();

    const topPx = (sfRect.top - dr.top) / scale - 2;
    const leftPx = (tpRect.left - dr.left) / scale - 2;
    const rightPx = (mpRect.right - dr.left) / scale + 2;
    const bottomPx = (bpRect.bottom - dr.top) / scale + 2;

    pageBoundsEl.style.top = topPx + 'px';
    pageBoundsEl.style.left = leftPx + 'px';
    pageBoundsEl.style.width = (rightPx - leftPx) + 'px';
    pageBoundsEl.style.height = (bottomPx - topPx) + 'px';
  }

  function drawTempoGuide() {
    const minusButton = document.querySelector('[data-id="NAV2-LEFT"]');
    const tempoTap = document.querySelector('[data-id="TEMPO-TAP"]');
    const guideHorizontal = document.getElementById('tempoGuideHorizontal');
    const guideVertical = document.getElementById('tempoGuideVertical');
    const masterButton = document.querySelector('[data-id="MASTER"]');
    const volumeControl = document.querySelector('.volume-block');
    const masterHorizontal = document.getElementById('masterGuideHorizontal');
    const masterVertical = document.getElementById('masterGuideVertical');
    const tempoVolumeGuide = document.getElementById('tempoVolumeGuide');
    const tempoXVertical = document.getElementById('tempoXVertical');
    const tempoXHorizontal = document.getElementById('tempoXHorizontal');
    const xButton = document.querySelector('[data-id="VOL-1"]');
    const navigationRight = document.querySelector('[data-id="NAV-RIGHT"]');
    const menuButton = document.querySelector('[data-id="PERC-MENU2"]');
    const menuGuideHorizontal = document.getElementById('menuGuideHorizontal');
    const menuGuideVertical = document.getElementById('menuGuideVertical');
    if (!minusButton || !tempoTap || !guideHorizontal || !guideVertical || !masterButton || !volumeControl || !tempoVolumeGuide || !tempoXVertical || !tempoXHorizontal || !xButton || !navigationRight || !menuButton || !menuGuideHorizontal || !menuGuideVertical) return;

    const deviceRect = deviceEl2.getBoundingClientRect();
    const scale = deviceRect.width / deviceEl2.offsetWidth || 1;
    const minusRect = minusButton.getBoundingClientRect();
    const tempoRect = tempoTap.getBoundingClientRect();
    const startX = (minusRect.left + minusRect.width / 2 - deviceRect.left) / scale;
    const startY = (minusRect.top + minusRect.height / 2 - deviceRect.top) / scale;
    const endX = (tempoRect.left + tempoRect.width / 2 - deviceRect.left) / scale;
    const endY = (tempoRect.top + tempoRect.height / 2 - deviceRect.top) / scale;
    const horizontalLeft = Math.min(startX, endX);

    guideHorizontal.style.left = horizontalLeft + 'px';
    guideHorizontal.style.top = startY + 'px';
    guideHorizontal.style.width = Math.abs(endX - startX) + 'px';
    guideVertical.style.left = endX + 'px';
    guideVertical.style.top = Math.min(startY, endY) + 'px';
    guideVertical.style.height = Math.abs(endY - startY) + 'px';

    function drawBranch(target, horizontal, vertical, originX = startX, originY = startY) {
      const targetRect = target.getBoundingClientRect();
      const targetX = (targetRect.left + targetRect.width / 2 - deviceRect.left) / scale;
      const targetY = (targetRect.top + targetRect.height / 2 - deviceRect.top) / scale;
      horizontal.style.left = Math.min(originX, targetX) + 'px';
      horizontal.style.top = originY + 'px';
      horizontal.style.width = Math.abs(targetX - originX) + 'px';
      vertical.style.left = targetX + 'px';
      vertical.style.top = Math.min(originY, targetY) + 'px';
      vertical.style.height = Math.abs(targetY - originY) + 'px';
    }

    drawBranch(masterButton, masterHorizontal, masterVertical);

    const volumeRect = volumeControl.getBoundingClientRect();
    const volumeX = (volumeRect.left - deviceRect.left) / scale;
    tempoVolumeGuide.style.left = Math.min(endX, volumeX) + 'px';
    tempoVolumeGuide.style.top = endY + 'px';
    tempoVolumeGuide.style.width = Math.abs(volumeX - endX) + 'px';

    const xRect = xButton.getBoundingClientRect();
    const xCenter = (xRect.left + xRect.width / 2 - deviceRect.left) / scale;
    const xCenterY = (xRect.top + xRect.height / 2 - deviceRect.top) / scale;
    tempoXVertical.style.left = endX + 'px';
    tempoXVertical.style.top = Math.min(endY, xCenterY) + 'px';
    tempoXVertical.style.height = Math.abs(xCenterY - endY) + 'px';
    tempoXHorizontal.style.left = Math.min(endX, xCenter) + 'px';
    tempoXHorizontal.style.top = xCenterY + 'px';
    tempoXHorizontal.style.width = Math.abs(xCenter - endX) + 'px';

    const navigationRect = navigationRight.getBoundingClientRect();
    const menuRect = menuButton.getBoundingClientRect();
    const navigationX = (navigationRect.left + navigationRect.width / 2 - deviceRect.left) / scale;
    const navigationY = (navigationRect.top + navigationRect.height / 2 - deviceRect.top) / scale;
    const menuX = (menuRect.left + menuRect.width / 2 - deviceRect.left) / scale;
    const menuY = (menuRect.top + menuRect.height / 2 - deviceRect.top) / scale;
    menuGuideHorizontal.style.left = Math.min(navigationX, menuX) + 'px';
    menuGuideHorizontal.style.top = navigationY + 'px';
    menuGuideHorizontal.style.width = Math.abs(menuX - navigationX) + 'px';
    menuGuideVertical.style.left = menuX + 'px';
    menuGuideVertical.style.top = Math.min(navigationY, menuY) + 'px';
    menuGuideVertical.style.height = Math.abs(menuY - navigationY) + 'px';

  }

  window.addEventListener('load', drawPageBounds);
  window.addEventListener('resize', drawPageBounds);
  window.addEventListener('load', drawTempoGuide);
  window.addEventListener('resize', drawTempoGuide);
  setTimeout(drawPageBounds, 50);
  setTimeout(drawTempoGuide, 50);
</script>

</body>
</html>
